services:
  - type: web
    name: dbconverter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_REGISTRATION
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: dbconverter-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: dbconverter-db
